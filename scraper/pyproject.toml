[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "transgourmet-scraper"
version = "1.0.0"
description = "Industrial-grade automated web scraper and intelligence toolkit for Transgourmet Switzerland"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Byteforce Team" }
]
dependencies = [
    "requests>=2.31.0",
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
    "beautifulsoup4>=4.12.0",
    "pypdf>=4.0.0",
    "rich>=13.7.0",
    "click>=8.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-mock>=3.14.0",
]

[project.scripts]
transgourmet-scraper = "scraper.cli:cli"

[tool.setuptools.packages.find]
where = ["."]
include = ["scraper*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "unit: Tier 1 Unit Tests",
    "boundary: Tier 2 Boundary & Negative Tests",
    "integration: Tier 3 Cross-Feature Integration Tests",
    "application: Tier 4 Real-World Application & Catering Scenarios",
    "security: Tier 5 Adversarial Penetration & Security Tests",
    "live: Tests requiring live internet access to Transgourmet Switzerland",
]
